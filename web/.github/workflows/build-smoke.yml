name: web build smoke

# Catches "modern Node API in build hook" P0s at PR time. Build host pins
# Node 18.x to mirror the production deploy environment; web/package.json
# engines.node + web/.npmrc engine-strict=true enforce the same locally.

on:
  pull_request:
    paths:
      - 'web/**'
      - 'data/dist/**'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'data/dist/**'

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
